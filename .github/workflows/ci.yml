name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make packed-spotter
      - name: Tests (AddressSanitizer, UBSan, 3000-case fuzz)
        run: make test
      - name: Sample outputs are up to date
        run: |
          make sample
          git diff --exit-code -- examples docs site
